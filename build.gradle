import java.time.Instant

buildscript {
    repositories {}
    dependencies {}
}

plugins {
    // id 'eclipse'
    id 'idea'
    id 'java'
    id 'net.minecraftforge.gradle' version "$forgegradle_version"
    // id 'org.spongepowered.mixin' version "$mixingradle_version"
    id 'net.minecraftforge.renamer' version "$renamer_version"
}

// apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft { it ->
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'mixin.debug.verbose', 'true'
            systemProperty 'mixin.debug.countInjections', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDir.convention layout.projectDirectory.dir('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing-mod', 'gtceu'
        }
    }

    accessTransformer = true
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dir 'libs'
    }

    // will not cause any issues. trust!
    mavenCentral()
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    maven { url "https://modmaven.dev/" }
    maven { url "https://maven.gegy.dev/releases/" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://maven.latvian.dev/releases/" }
    maven { url "https://jitpack.io/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
    maven { url "https://maven.theillusivec4.top/" }
    maven { url "https://maven.wispforest.io/releases/" }
    maven { url "https://maven.su5ed.dev/releases/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://api.modrinth.com/maven/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.gtceu.com/" }
    maven { url "https://maven.firstdark.dev/snapshots/" }
    maven { url "https://repo.repsy.io/mvn/toma/public/" }
    maven { url "https://api.repsy.io/mvn/toma/public/" }
    maven { url "https://mvn.devos.one/snapshots/" }
    maven { url "https://maven.tterrag.com/" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.minecraftforge.net/" }
    maven { url "https://maven.hexxy.media/" }
    maven { url "https://maven.ladysnake.org/releases/" }
    maven { url "https://maven.parchmentmc.org/" }
    maven { url "https://maven.ryanliptak.com/" }
    maven { url "https://repo.cleanroommc.com/" }
    maven { url "https://maven.createmod.net" }
}

final String LOCAL_GTCEU = "libs:gtceu-1.20.1:8.0.0-dev-slim"

dependencies { DependencyHandler it ->
    minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    it.implementation minecraft.dependency

    // assert gtceu_version == "local"
    String gtceu = "com.gregtechceu.gtceu:gtceu-$minecraft_version:$gtceu_version"
    if (gtceu_version == "local") {
        gtceu = LOCAL_GTCEU
    }

    it.implementation renamer.dependency("appeng:appliedenergistics2-forge:$ae2_version")
    it.implementation renamer.dependency(gtceu)
    //it.compileOnly "com.lowdragmc.ldlib:ldlib-forge-$minecraft_version:$ldlib_version", { it.transitive = false }
    it.implementation renamer.dependency("com.tterrag.registrate:Registrate:$registrate_version")
    it.implementation renamer.dependency("dev.toma.configuration:configuration-$minecraft_version:$configuration_version-forge", {
        it.libraries = files()
    })
    it.implementation renamer.dependency("at.petra-k.hexcasting:hexcasting-forge-$minecraft_version:$hexcasting_version")
    it.implementation renamer.dependency("thedarkcolour:kotlinforforge:$kff_version")
    it.implementation renamer.dependency("at.petra-k.paucal:paucal-forge-$minecraft_version:$paucal_version")

    it.compileOnly renamer.dependency("top.theillusivec4.caelus:caelus-forge:$caelus_version+$minecraft_version:api")
    it.runtimeOnly renamer.dependency("top.theillusivec4.caelus:caelus-forge:$caelus_version+$minecraft_version")

    it.compileOnly renamer.dependency("top.theillusivec4.curios:curios-forge:$curios_version+$minecraft_version:api")
    it.runtimeOnly renamer.dependency("top.theillusivec4.curios:curios-forge:$curios_version+$minecraft_version")

    it.implementation renamer.dependency("com.samsthenerd.inline:inline-forge:$minecraft_version-$inline_version")
    it.implementation renamer.dependency("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-FORGE")
    it.implementation renamer.dependency("me.shedaniel.cloth:cloth-config-forge:$cloth_version")
    it.implementation renamer.dependency("brachy.modularui:modularui-mc$minecraft_version:$mui_version")
    // dev/testing
    it.runtimeOnly renamer.dependency("maven.modrinth:jade:$jade_version+forge")
    it.runtimeOnly renamer.dependency("maven.modrinth:jade-addons-forge:$jade_forge_version+forge")
    it.runtimeOnly renamer.dependency("squeek.appleskin:appleskin-forge:mc$minecraft_version-$appleskin_version")
    it.runtimeOnly renamer.dependency("mezz.jei:jei-$minecraft_version-forge:$jei_version")

    // it is with great displeasure that I grant the unholy, incompatible mess that is EMI the rank of 'comptime dependency'
    it.implementation renamer.dependency("dev.emi:emi-forge:$emi_version+$minecraft_version")

    it.annotationProcessor 'org.spongepowered:mixin:' + mixinprocessor_version + ':processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            hex_version_range      : hex_version_range,
            ae_version_range       : ae_version_range,
            gt_version_range       : gt_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    filesMatching("build-meta.json") {
        Instant now = Instant.now()

        expand replaceProperties + [
                timestamp: "%s %s".formatted(now.getEpochSecond(), now.getNano())
        ]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

var rev = renamer.convert('reverse', minecraft.dependency.toSrgFile) {
    reverse = true
}

renamer.mappings.from minecraft.dependency.toSrgFile

renamer.enableMixinRefmaps {
    config "${mod_id}.mixins.json"
    mappings {
        it.map rev
    }
}

tasks.named('mergeMixinMappings') { format = 'srg' }

renamer.classes(tasks.named('jar', Jar)) {
    it.archiveClassifier = 'srg'
    it.accessTransformers = true
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}